services:
  app:
    build:
      context: .
    container_name: homefinder-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8080}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-homefinder}
      MYSQL_USER: ${MYSQL_USER:-homefinder_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:${APP_PORT:-8080}"
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: homefinder-mysql
    restart: unless-stopped
    command:
      - --event_scheduler=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-homefinder}
      MYSQL_USER: ${MYSQL_USER:-homefinder_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
