{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HomeFinder{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/shared-shell.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="site-shell">
        {% include "partials/_navigation.html" %}
        <main id="main-content" class="site-main">
            {% include "partials/_flash_messages.html" %}
            {% block page_header %}{% endblock %}
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        document.addEventListener("change", function (event) {
            const checkbox = event.target;
            if (!checkbox.matches || !checkbox.matches(".favorite-checkbox")) return;
            const form = checkbox.closest(".favorite-form");
            if (!form) return;
            setTimeout(function () { form.submit(); }, 700);
        });

        (function () {
            const containers = document.querySelectorAll("[data-action-tabs]");
            if (!containers.length) return;
            document.documentElement.setAttribute("data-tabs-enhanced", "");

            containers.forEach(function (container) {
                const tabs = container.querySelectorAll("[data-tab-target]");
                const panels = container.querySelectorAll("[data-tab-panel]");

                function activate(name) {
                    tabs.forEach(function (tab) {
                        const isActive = tab.dataset.tabTarget === name;
                        tab.setAttribute("aria-selected", isActive ? "true" : "false");
                    });
                    panels.forEach(function (panel) {
                        panel.classList.toggle("is-active", panel.dataset.tabPanel === name);
                    });
                }

                tabs.forEach(function (tab) {
                    tab.addEventListener("click", function () {
                        activate(tab.dataset.tabTarget);
                    });
                });

                const initial = container.dataset.initialTab;
                const initialTab = container.querySelector('[data-tab-target="' + initial + '"]');
                activate(initialTab ? initial : (tabs[0] && tabs[0].dataset.tabTarget));
            });
        })();
    </script>
</body>
</html>
