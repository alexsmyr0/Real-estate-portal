{% extends "base.html" %}

{% block title %}HomeFinder | Welcome{% endblock %}

{% block extra_head %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .landing-v2 {
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            min-height: calc(100vh - 8rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .landing-v2-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .landing-v2-brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 6rem;
            height: 6rem;
            border-radius: 1.6rem;
            background: var(--ink-950);
            color: var(--white);
            font-family: "Playfair Display", Georgia, serif;
            font-weight: 800;
            font-size: 3.25rem;
            letter-spacing: 0.04em;
        }

        .landing-v2-brand-name {
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 700;
            color: var(--ink-950);
            line-height: 1;
            margin: 0;
        }

        .landing-v2-title-group {
            width: fit-content;
            max-width: 100%;
        }

        .landing-v2-title {
            font-size: clamp(2.5rem, 8vw, 7rem);
            font-weight: 700;
            color: var(--ink-950);
            line-height: 1.05;
            margin: 0;
            white-space: nowrap;
        }

        .landing-v2-action {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
        }

        .landing-v2-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.95rem 1.9rem;
            border-radius: 999px;
            background: var(--accent);
            color: var(--white);
            font-family: "Playfair Display", Georgia, serif;
            font-size: 1.35rem;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--accent);
            box-shadow: 0 4px 14px rgba(15, 123, 108, 0.25);
            white-space: nowrap;
        }

        .landing-v2-button:focus-visible {
            outline: 3px solid var(--accent-deep);
            outline-offset: 3px;
        }
    </style>
{% endblock %}

{% block content %}
    <section class="landing-v2">
        <div class="landing-v2-brand">
            <span class="landing-v2-brand-mark" aria-hidden="true">HF</span>
            <h2 class="landing-v2-brand-name">HomeFinder</h2>
        </div>
        <div class="landing-v2-title-group">
            <h1 class="landing-v2-title">Your Dream Starts Here</h1>
            <div class="landing-v2-action">
                <a href="{% url 'site-catalog' %}" class="landing-v2-button">Browse Listings</a>
            </div>
        </div>
    </section>
{% endblock %}
