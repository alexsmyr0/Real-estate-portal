{% url "site-home" as site_home_url %}
{% url "site-catalog" as site_catalog_url %}
<header class="site-header">
    <a class="brand" href="{{ site_home_url }}">
        <span class="brand-mark">HF</span>
        <span>HomeFinder</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
        <a class="nav-link{% if request.path == site_home_url %} is-active{% endif %}" href="{{ site_home_url }}">Shell Home</a>
        <a class="nav-link{% if request.path == site_catalog_url %} is-active{% endif %}" href="{{ site_catalog_url }}">Catalog Shell</a>
    </nav>
    <div class="nav-auth">
        {% if request.user.is_authenticated %}
            <span class="auth-chip">{{ request.user.full_name|default:request.user.email }}</span>
            <form method="post" action="{% url 'auth-logout' %}">
                {% csrf_token %}
                <button type="submit" class="button button-ghost">Sign out</button>
            </form>
        {% else %}
            <span class="auth-chip auth-chip-guest">Guest</span>
            <span class="button button-disabled" aria-disabled="true">Sign In (A-04)</span>
        {% endif %}
    </div>
</header>
