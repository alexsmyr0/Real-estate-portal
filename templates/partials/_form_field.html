{% load form_accessibility %}
<div class="form-field{% if extra_classes %} {{ extra_classes }}{% endif %}{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field|accessible_widget }}
    {% if field.help_text %}
        <p id="{{ field.id_for_label }}_helptext" class="form-help">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <div id="{{ field.id_for_label }}_errors" role="alert">
            {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
</div>
