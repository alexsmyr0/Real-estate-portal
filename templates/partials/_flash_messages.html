{% if messages %}
    <section class="flash-stack" aria-live="polite">
        {% for message in messages %}
            <div class="flash-message{% if 'error' in message.tags %} flash-error{% elif 'warning' in message.tags %} flash-warning{% elif 'success' in message.tags %} flash-success{% else %} flash-info{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </section>
{% endif %}
