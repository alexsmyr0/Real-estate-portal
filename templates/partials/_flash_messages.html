{% if messages %}
    <section class="flash-stack" aria-live="polite">
        {% for message in messages %}
            <div
                class="flash-message{% if 'error' in message.tags %} flash-error{% elif 'warning' in message.tags %} flash-warning{% elif 'success' in message.tags %} flash-success{% else %} flash-info{% endif %}"
                {% if 'error' in message.tags or 'warning' in message.tags %}role="alert"{% else %}role="status"{% endif %}
            >
                {{ message }}
            </div>
        {% endfor %}
    </section>
{% endif %}
