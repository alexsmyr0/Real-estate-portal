{% if page_obj.has_other_pages %}
    <nav class="pagination" aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a class="button button-ghost" href="?page={{ page_obj.previous_page_number }}" rel="prev">Previous</a>
        {% else %}
            <span class="button button-ghost is-disabled" aria-disabled="true">Previous</span>
        {% endif %}

        <span class="pagination-status">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

        {% if page_obj.has_next %}
            <a class="button button-ghost" href="?page={{ page_obj.next_page_number }}" rel="next">Next</a>
        {% else %}
            <span class="button button-ghost is-disabled" aria-disabled="true">Next</span>
        {% endif %}
    </nav>
{% endif %}
