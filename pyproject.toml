[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homefinder"
version = "0.1.0"
description = "HomeFinder backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "PyMySQL>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-django>=4.12,<5.0",
    "ruff>=0.15,<0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "homefinder.settings"
pythonpath = ["src"]
