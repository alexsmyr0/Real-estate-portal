[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homefinder"
version = "0.1.0"
description = "HomeFinder backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "PyMySQL>=1.1,<2.0",
    "cryptography>=42,<47",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
